[package]
name = "system"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
app_core = { path = "../core" }
# 数据访问漏斗(设计 6.1):查询全经 app_data(测试套件
# 切 test-util 面后,sea-orm 直连已移除,DM 方言测试挪 app-data dialect 套件)。
app_data.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
axum = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
validator.workspace = true
tracing.workspace = true
chrono.workspace = true
bcrypt.workspace = true
anyhow.workspace = true
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio.workspace = true
redis.workspace = true
deadpool-redis.workspace = true
uuid.workspace = true
tera = "1"
zip = "2"
rust-embed = "8"
base64.workspace = true
regex.workspace = true
lazy_static = "1"
md-5 = "0.10"
form_urlencoded = "1"

[dev-dependencies]
tokio.workspace = true
# app-data 的测试脚手架(设计 9 节第 4 条):业务 crate 测试只经
# dev-dependencies 启用 test-util(policy 测试的 SQL 断言面)。
app_data = { workspace = true, features = ["test-util"] }
